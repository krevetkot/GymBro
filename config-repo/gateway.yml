# Наружу открыты только /api/** и Swagger. Пути /internal/** не маршрутизируются:
# их вызывают сервисы друг у друга напрямую, через Eureka.

server:
  port: ${GATEWAY_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-api
              uri: lb://identity-service
              order: -10
              predicates:
                - Path=/api/v1/users,/api/v1/users/**
            - id: identity-docs
              uri: lb://identity-service
              predicates:
                - Path=/identity/v3/api-docs
              filters:
                - StripPrefix=1
            - id: monolith-api
              uri: lb://monolith
              predicates:
                - Path=/api/**
            - id: monolith-docs
              uri: lb://monolith
              predicates:
                - Path=/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**
