server:
  port: ${IDENTITY_PORT:8082}

spring:
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5434/gymbro_identity}
    username: ${IDENTITY_DB_USER:gymbro_identity}
    password: ${IDENTITY_DB_PASSWORD:gymbro_identity}
    hikari:
      maximum-pool-size: ${IDENTITY_DB_POOL_SIZE:10}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    path: /v3/api-docs
