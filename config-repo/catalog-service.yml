spring:

  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5435/gymbro_catalog}
    username: ${CATALOG_DB_USER:gymbro_catalog}
    password: ${CATALOG_DB_PASSWORD:gymbro_catalog}
    hikari:
      maximum-pool-size: ${CATALOG_DB_POOL_SIZE:10}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${CATALOG_PORT:8083}

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
    liquibase: INFO
