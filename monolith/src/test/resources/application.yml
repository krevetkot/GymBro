# В тестах Config Server не поднимается: те же файлы из config-repo читаются напрямую.

spring:

  application:
    name: monolith

  config:
    import:
      - file:../config-repo/application.yml
      - file:../config-repo/monolith.yml

  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false
