databaseChangeLog:
  - changeSet:
      id: identity-006-hash-existing-passwords
      author: gymbro
      changes:
        - sql:
            sql: |
              CREATE EXTENSION IF NOT EXISTS pgcrypto;
              UPDATE users
              SET password = crypt(password, gen_salt('bf', 10))
              WHERE password !~ '^\$2[aby]\$[0-9][0-9]\$[./A-Za-z0-9]{53}$';
