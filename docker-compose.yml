x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30

x-cloud-env: &cloud-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://eureka-server:8761/eureka/
  SQL_LOG_LEVEL: ${SQL_LOG_LEVEL:-INFO}

services:
  identity-db:
    image: postgres:17-alpine
    container_name: gymbro-identity-db
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME:-gymbro_identity}
      POSTGRES_USER: ${IDENTITY_DB_USER:-gymbro_identity}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-gymbro_identity}
    ports:
      - "${IDENTITY_DB_PORT:-5434}:5432"
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER:-gymbro_identity} -d ${IDENTITY_DB_NAME:-gymbro_identity}"]
      <<: *healthcheck

  catalog-db:
    image: postgres:17-alpine
    container_name: gymbro-catalog-db
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-gymbro_catalog}
      POSTGRES_USER: ${CATALOG_DB_USER:-gymbro_catalog}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-gymbro_catalog}
    ports:
      - "${CATALOG_DB_PORT:-5435}:5432"
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER:-gymbro_catalog} -d ${CATALOG_DB_NAME:-gymbro_catalog}"]
      <<: *healthcheck

  profile-db:
    image: postgres:17-alpine
    container_name: gymbro-profile-db
    environment:
      POSTGRES_DB: ${PROFILE_DB_NAME:-gymbro_profile}
      POSTGRES_USER: ${PROFILE_DB_USER:-gymbro_profile}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD:-gymbro_profile}
    ports:
      - "${PROFILE_DB_PORT:-5436}:5432"
    volumes:
      - profile_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROFILE_DB_USER:-gymbro_profile} -d ${PROFILE_DB_NAME:-gymbro_profile}"]
      <<: *healthcheck

  matching-db:
    image: postgres:17-alpine
    container_name: gymbro-matching-db
    environment:
      POSTGRES_DB: ${MATCHING_DB_NAME:-gymbro_matching}
      POSTGRES_USER: ${MATCHING_DB_USER:-gymbro_matching}
      POSTGRES_PASSWORD: ${MATCHING_DB_PASSWORD:-gymbro_matching}
    ports:
      - "${MATCHING_DB_PORT:-5437}:5432"
    volumes:
      - matching_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MATCHING_DB_USER:-gymbro_matching} -d ${MATCHING_DB_NAME:-gymbro_matching}"]
      <<: *healthcheck

  config-server:
    build:
      context: .
      args:
        SERVICE: config-server
    container_name: gymbro-config-server
    environment:
      CONFIG_REPO: file:/config-repo/,file:/config-repo/{application}/
    volumes:
      - ./config-repo:/config-repo:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP"]
      <<: *healthcheck

  eureka-server:
    build:
      context: .
      args:
        SERVICE: eureka-server
    container_name: gymbro-eureka-server
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]
      <<: *healthcheck

  identity-service:
    build:
      context: .
      args:
        SERVICE: identity-service
    container_name: gymbro-identity-service
    depends_on:
      identity-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      <<: *cloud-env
      IDENTITY_DB_URL: jdbc:postgresql://identity-db:5432/${IDENTITY_DB_NAME:-gymbro_identity}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-gymbro_identity}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-gymbro_identity}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      <<: *healthcheck

  catalog-service:
    build:
      context: .
      args:
        SERVICE: catalog-service
    container_name: gymbro-catalog-service
    depends_on:
      catalog-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      <<: *cloud-env
      CATALOG_DB_URL: jdbc:postgresql://catalog-db:5432/${CATALOG_DB_NAME:-gymbro_catalog}
      CATALOG_R2DBC_URL: r2dbc:postgresql://catalog-db:5432/${CATALOG_DB_NAME:-gymbro_catalog}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-gymbro_catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-gymbro_catalog}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      <<: *healthcheck

  profile-service:
    build:
      context: .
      args:
        SERVICE: profile-service
    container_name: gymbro-profile-service
    depends_on:
      profile-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      <<: *cloud-env
      PROFILE_DB_URL: jdbc:postgresql://profile-db:5432/${PROFILE_DB_NAME:-gymbro_profile}
      PROFILE_DB_USER: ${PROFILE_DB_USER:-gymbro_profile}
      PROFILE_DB_PASSWORD: ${PROFILE_DB_PASSWORD:-gymbro_profile}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      <<: *healthcheck

  matching-service:
    build:
      context: .
      args:
        SERVICE: matching-service
    container_name: gymbro-matching-service
    depends_on:
      matching-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      <<: *cloud-env
      MATCHING_DB_URL: jdbc:postgresql://matching-db:5432/${MATCHING_DB_NAME:-gymbro_matching}
      MATCHING_DB_USER: ${MATCHING_DB_USER:-gymbro_matching}
      MATCHING_DB_PASSWORD: ${MATCHING_DB_PASSWORD:-gymbro_matching}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]
      <<: *healthcheck

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    container_name: gymbro-gateway
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      <<: *cloud-env
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  identity_pgdata:
  catalog_pgdata:
  profile_pgdata:
  matching_pgdata:
