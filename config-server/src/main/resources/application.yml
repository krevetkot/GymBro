spring:

  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO:file:./config-repo/,file:./config-repo/{application}/,file:../config-repo/,file:../config-repo/{application}/}

server:
  port: ${CONFIG_SERVER_PORT:8888}
