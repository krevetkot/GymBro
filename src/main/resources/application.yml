spring:
  application:
    name: gymbro

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymbro}
    username: ${DB_USER:gymbro}
    password: ${DB_PASSWORD:gymbro}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
        one-indexed-parameters: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.jdbc.core: ${SQL_LOG_LEVEL:INFO}
    liquibase: INFO
