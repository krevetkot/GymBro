
spring:

  application:
    name: gymbro

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/gymbro}
    username: ${DB_USER:gymbro}
    password: ${DB_PASSWORD:gymbro}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
        one-indexed-parameters: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8888}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
    liquibase: INFO
