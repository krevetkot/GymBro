
spring:

  application:
    name: gymbro

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/gymbro}
    username: ${DB_USER:gymbro}
    password: ${DB_PASSWORD:gymbro}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
        one-indexed-parameters: false

  jackson:
    default-property-inclusion: non_null

gymbro:
  jdbc:
    schema-validation: validate

server:
  port: 8888

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.jdbc.core: ${SQL_LOG_LEVEL:INFO}
    liquibase: INFO
