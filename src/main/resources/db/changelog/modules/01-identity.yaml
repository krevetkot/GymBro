databaseChangeLog:
  - changeSet:
      id: identity-001-users
      author: gymbro
      changes:
        - sql:
            sql: |
              CREATE TABLE users (
                  id            BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                  email         VARCHAR(255) NOT NULL,
                  password      VARCHAR(255) NOT NULL,
                  role          VARCHAR(16)  NOT NULL DEFAULT 'USER',
                  status        VARCHAR(16)  NOT NULL DEFAULT 'ACTIVE',
                  created_at    TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  CONSTRAINT users_email_unique UNIQUE (email),
                  CONSTRAINT users_role_check   CHECK (role IN ('USER', 'TRAINER', 'ADMIN')),
                  CONSTRAINT users_status_check CHECK (status IN ('ACTIVE', 'BANNED'))
              )
      rollback:
        - sql:
            sql: DROP TABLE users

  - changeSet:
      id: identity-002-seed-admin
      author: gymbro
      changes:
        - sql:
            sql: |
              INSERT INTO users (email, password, role, status)
              VALUES ('admin@gymbro.local', 'admin12345', 'ADMIN', 'ACTIVE')
      rollback:
        - sql:
            sql: DELETE FROM users WHERE email = 'admin@gymbro.local'
