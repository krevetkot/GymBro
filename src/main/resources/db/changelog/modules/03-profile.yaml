databaseChangeLog:
  - changeSet:
      id: profile-001-user-profiles
      author: gymbro
      changes:
        - sql:
            sql: |
              CREATE TABLE user_profiles (
                  id         BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
                  user_id    BIGINT       NOT NULL REFERENCES users (id) ON DELETE CASCADE,
                  name       VARCHAR(100) NOT NULL,
                  birth_date DATE         NOT NULL,
                  about      TEXT,
                  updated_at TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  CONSTRAINT user_profiles_user_unique UNIQUE (user_id)
              )
      rollback:
        - sql:
            sql: DROP TABLE user_profiles

  - changeSet:
      id: profile-002-user-sports
      author: gymbro
      changes:
        - sql:
            sql: |
              CREATE TABLE user_sports (
                  id         BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  profile_id BIGINT      NOT NULL REFERENCES user_profiles (id) ON DELETE CASCADE,
                  sport_id   BIGINT      NOT NULL REFERENCES sports (id),
                  level      VARCHAR(16) NOT NULL,
                  CONSTRAINT user_sports_unique UNIQUE (profile_id, sport_id),
                  CONSTRAINT user_sports_level_check
                      CHECK (level IN ('BEGINNER', 'INTERMEDIATE', 'ADVANCED'))
              );
              CREATE INDEX user_sports_sport_idx ON user_sports (sport_id);
      rollback:
        - sql:
            sql: DROP TABLE user_sports

  - changeSet:
      id: profile-003-user-gyms
      author: gymbro
      changes:
        - sql:
            sql: |
              CREATE TABLE user_gyms (
                  id         BIGINT NOT NULL GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  profile_id BIGINT NOT NULL REFERENCES user_profiles (id) ON DELETE CASCADE,
                  gym_id     BIGINT NOT NULL REFERENCES gyms (id),
                  CONSTRAINT user_gyms_unique UNIQUE (profile_id, gym_id)
              );
              CREATE INDEX user_gyms_gym_idx ON user_gyms (gym_id);
      rollback:
        - sql:
            sql: DROP TABLE user_gyms
